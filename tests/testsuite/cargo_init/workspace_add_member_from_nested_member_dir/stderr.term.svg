<svg width="1936px" height="218px" xmlns="http://www.w3.org/2000/svg">
  <style>
    .fg { fill: #AAAAAA }
    .bg { fill: #000000 }
    .fg-bright-green { fill: #55FF55 }
    .fg-yellow { fill: #AA5500 }
    .container {
      padding: 0 10px;
      line-height: 18px;
    }
    .bold { font-weight: bold; }
    tspan {
      font: 14px SFMono-Regular, Consolas, Liberation Mono, Menlo, monospace;
      white-space: pre;
      line-height: 18px;
    }
  </style>

  <rect width="100%" height="100%" y="0" rx="4.5" class="bg" />

  <text xml:space="preserve" class="container fg">
    <tspan x="10px" y="28px"><tspan class="fg-bright-green bold">    Creating</tspan><tspan> binary (application) package</tspan>
</tspan>
    <tspan x="10px" y="46px"><tspan class="fg-yellow bold">warning</tspan><tspan>: compiling this new package may not work due to invalid workspace configuration</tspan>
</tspan>
    <tspan x="10px" y="64px">
</tspan>
    <tspan x="10px" y="82px"><tspan>current package believes it's in a workspace when it's not:</tspan>
</tspan>
    <tspan x="10px" y="100px"><tspan>current:   [ROOT]/case/a-crate/macros/Cargo.toml</tspan>
</tspan>
    <tspan x="10px" y="118px"><tspan>workspace: [ROOT]/case/Cargo.toml</tspan>
</tspan>
    <tspan x="10px" y="136px">
</tspan>
    <tspan x="10px" y="154px"><tspan>this may be fixable by adding `a-crate/macros` to the `workspace.members` array of the manifest located at: [ROOT]/case/Cargo.toml</tspan>
</tspan>
    <tspan x="10px" y="172px"><tspan>Alternatively, to keep it out of the workspace, add the package to the `workspace.exclude` array, or add an empty `[workspace]` table to the package's manifest.</tspan>
</tspan>
    <tspan x="10px" y="190px"><tspan class="fg-bright-green bold">note</tspan><tspan>: see more `Cargo.toml` keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html</tspan>
</tspan>
    <tspan x="10px" y="208px">
</tspan>
  </text>

</svg>
