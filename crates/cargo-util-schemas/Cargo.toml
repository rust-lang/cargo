[package]
name = "cargo-util-schemas"
version = "0.17.0"
rust-version = "1.100"  # MSRV:1
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Deserialization schemas for Cargo"

[dependencies]
jiff = { workspace = true, features = ["std", "serde"] }
schemars = { workspace = true, features = ["preserve_order", "semver1"], optional = true }
semver.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, optional = true }
serde-untagged.workspace = true
thiserror.workspace = true
toml = { workspace = true, features = ["serde"] }
unicode-ident.workspace = true
url.workspace = true

[lints]
workspace = true

[dev-dependencies]
divan.workspace = true
snapbox.workspace = true
serde_json.workspace = true
toml = { workspace = true, features = ["std", "serde", "parse", "preserve_order"] }

[[bench]]
name = "manifest"
harness = false

[features]
unstable-schema = ["dep:schemars", "dep:serde_json"]
