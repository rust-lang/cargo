[package]
name = "cargo-util-config"
version = "0.1.0"
rust-version = "1.100"  # MSRV:1
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Cargo's layered config system"

[package.metadata.docs.rs]
all-features = true

[dependencies]
anyhow.workspace = true
cargo-credential.workspace = true
cargo-util.workspace = true
cargo-util-schemas.workspace = true
cargo-util-terminal.workspace = true
schemars = { workspace = true, features = ["preserve_order", "semver1"], optional = true }
serde = { workspace = true, features = ["derive"] }
serde-untagged.workspace = true
toml = { workspace = true, features = ["std", "serde", "parse", "display", "preserve_order"] }
tracing.workspace = true

[dev-dependencies]
serde_json.workspace = true
snapbox.workspace = true

[lints]
workspace = true

[features]
unstable-schema = ["cargo-util-schemas/unstable-schema", "dep:schemars"]
